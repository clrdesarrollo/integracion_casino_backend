# Producción: usa la imagen publicada por Jenkins, sin montar el código.
#
# En el servidor solo hacen falta este archivo y `variables.env` (ver variables.env.example),
# con al menos: DEBUG=0, DJANGO_SECRET_KEY, POSTGRES_USER/PASSWORD, ALLOWED_HOSTS y
# CSRF_TRUSTED_ORIGINS con el dominio real (https://...).
#
# Despliegue (TAG = versión que imprime Jenkins al final del build, p. ej. 1.0.3):
#   docker login registry.clrobotics.cl
#   TAG=1.0.3 docker compose -f docker-compose.prod.yml pull
#   TAG=1.0.3 docker compose -f docker-compose.prod.yml up -d --remove-orphans
# Volver atrás = repetir con el TAG anterior.

services:

  pgdb:
    image: postgres:16-alpine   # misma versión que docker/postgresql/Dockerfile y el CI
    container_name: "casino_pgdb"
    env_file:
      - variables.env
    # Sin puertos publicados: solo la alcanza el backend por la red interna.
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: "casino_redis"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging

  web:
    image: registry.clrobotics.cl/casino-backend:${TAG:-latest}
    container_name: "casino_backend"
    # migrate + collectstatic + ensure_superuser, y con DEBUG=0 arranca Daphne (HTTP + WebSocket).
    command: ["/entrypoint.sh"]
    env_file:
      - variables.env
    environment:
      HOST_DB: pgdb
      PORT_DB: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      # Detrás del proxy/TLS del servidor. WEB_PORT permite cambiar el puerto del host.
      - "${WEB_PORT:-8010}:8000"
    depends_on:
      pgdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/healthcheck/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *logging

volumes:
  pgdata:
